{% extends 'base.html' %}
{% block title %}Entrar - Studio3D{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-2xl font-extrabold text-slate-900 mb-6 text-center">Entrar</h1>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm">
                {{ form.non_field_errors }}
            </div>
            {% endif %}
            <div class="space-y-1">
                <label class="block text-sm font-medium text-slate-700" for="id_username">Usuário</label>
                {{ form.username }}
            </div>
            <div class="space-y-1">
                <label class="block text-sm font-medium text-slate-700" for="id_password">Senha</label>
                {{ form.password }}
            </div>
            <button type="submit" class="w-full bg-brand-600 text-white font-semibold rounded-lg py-2.5 hover:bg-brand-700 transition-colors">Entrar</button>
        </form>
        <p class="text-sm text-slate-500 mt-4 text-center">Não tem conta? <a href="{% url 'signup' %}" class="text-brand-600 font-semibold hover:text-brand-700">Criar conta</a></p>
    </div>
</div>
{% endblock %}
